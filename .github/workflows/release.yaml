name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the manifest version matches the tag
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/fogos_pt/manifest.json'))['version'])")
          test "v$version" = "${{ github.event.release.tag_name }}"
      - name: Zip the integration
        run: cd custom_components/fogos_pt && zip -r ../../fogos_pt.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: fogos_pt.zip
